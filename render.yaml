# One-service deploy on Render (https://render.com).
# The built frontend (frontend/dist) is committed, so the build only needs
# Python -- no Node step. FastAPI serves the SPA + the API together.
services:
  - type: web
    name: backtest-reality-check
    runtime: python
    branch: claude/new-session-6nsvex
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
